name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run host test suite
        run: bash test/host/run.sh
      - name: Check repository hygiene
        run: bash tools/check_repo_hygiene.sh

  psp-build:
    name: PSP build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: docker/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('docker/Dockerfile') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('docker/Dockerfile') }}-
      - name: Build EBOOT.PBP
        run: bash docker/build.sh
      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: openlua-eboot
          path: EBOOT.PBP
          if-no-files-found: error
          retention-days: 7
